spring.application.name=holden

server.port=${PORT:8080}

# Database connection: Uses cloud environment variables on Render if set, otherwise defaults to local MySQL
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:holden}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123456}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

holden.upload-dir=uploads/certificates

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
